# The structure of unpoly.com.
#
# This file owns *relations* only: which pages form a topic, in which order, and
# which interfaces the API reference lists. Every fact about a single document
# (its title, slug, menu title, visibility) lives in that document's directives.
#
# The site fails to build when a page or module is missing here, listed twice, or
# names a slug that does not exist. See docs/contributing/documentation.md.

learn:
  title: Learn
  reading: linear

  topics:
    - type: page-group
      title: Getting started
      pages:
        - install
        - attributes-and-options

    - type: page-group
      title: Links
      pages:
        - handling-everything
        - preloading
        - navigation-bars
        - faux-interactive-elements

    - type: page-group
